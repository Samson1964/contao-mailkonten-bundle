services:
    # Stündliche Prüfung der E-Mail-Konten (Anzahl der E-Mails, Speicherbelegung;
    # die tägliche IMAP-Anmeldung hält die Konten beim Anbieter zugleich aktiv).
    #
    # Hinweis: Hier stand früher ein _instanceof-Block für FrameworkAwareInterface
    # und ContainerAwareInterface. Keine Klasse dieser Erweiterung setzt die
    # beiden um, und ContainerAwareInterface gibt es seit Symfony 7 nicht mehr —
    # der Block verhinderte damit den Containerbau unter Contao 5.
    Schachbulle\ContaoMailkontenBundle\Cron\Kontenpruefung:
        public: true
        tags:
            - { name: contao.cronjob, interval: hourly }

    # Serversuche hinter dem Knopf "Server abrufen" im Formular. Die Fabrik
    # setzt den HTTP-Client hinter einen Schutz vor Abfragen interner Adressen.
    # Öffentlich, weil Classes\Serverabruf sie über den Container holt (der
    # Modulschlüssel "server" wird von Contao ohne Konstruktorargumente erzeugt).
    Schachbulle\ContaoMailkontenBundle\Classes\Serversuche:
        public: true
        factory: ['Schachbulle\ContaoMailkontenBundle\Classes\Serversuche', 'mitSchutz']
        arguments:
            - '@http_client'

    # Führt beim nächsten contao:migrate das aufgelöste Feld "Anmerkungen" in
    # die Info über, bevor der Schema-Abgleich die Spalte entfernt.
    Schachbulle\ContaoMailkontenBundle\Migration\AnmerkungenMigration:
        public: true
        arguments:
            - '@database_connection'
        tags:
            - { name: contao.migration }
